<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <title>Fairway Fling</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eaf5df;
      --panel: #fffdf4;
      --ink: #17352b;
      --muted: #53685e;
      --line: rgba(23,53,43,.14);
      --green: #167a4a;
      --green-2: #0d5d3a;
      --lime: #cde95b;
      --sun: #ffd251;
      --coral: #ef654d;
      --button-ink: #112b22;
      --shadow: 0 18px 42px rgba(45,91,57,.16);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0f1d19;
        --panel: #172924;
        --ink: #f3f6e8;
        --muted: #b9c9c0;
        --line: rgba(236,247,239,.14);
        --green: #45bf7d;
        --green-2: #9be1ad;
        --lime: #cfe769;
        --sun: #ffd868;
        --coral: #ff826d;
        --button-ink: #102b21;
        --shadow: 0 18px 42px rgba(0,0,0,.32);
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 8% 4%, rgba(255,210,81,.22), transparent 24rem),
        linear-gradient(180deg, var(--page), color-mix(in srgb, var(--page), #ffffff 22%));
      color: var(--ink);
      font-family: "Nunito Sans", ui-rounded, system-ui, sans-serif;
      overscroll-behavior: none;
    }
    button { font: inherit; }
    .wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 18px calc(28px + env(safe-area-inset-bottom));
    }
    .game-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 2px 12px;
    }
    .eyebrow {
      margin: 0 0 2px;
      color: var(--green);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Lilita One", ui-rounded, sans-serif;
      font-size: clamp(1.75rem, 4.6vw, 3.4rem);
      line-height: .95;
      letter-spacing: .01em;
      font-weight: 400;
    }
    .scoreboard { display: flex; gap: 8px; }
    .score-chip {
      min-width: 88px;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 5px 0 color-mix(in srgb, var(--green-2), transparent 60%);
      border-radius: 14px;
      text-align: center;
    }
    .score-chip small { display:block; color:var(--muted); font-size:.67rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .score-chip strong { display:block; margin-top:1px; font-size:1.05rem; line-height:1.1; }
    .stage-shell {
      position: relative;
      overflow: hidden;
      border: 3px solid color-mix(in srgb, var(--green-2), transparent 15%);
      border-radius: 22px 22px 12px 12px;
      background: #9cdcf0;
      box-shadow: var(--shadow), 0 7px 0 var(--green-2);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas {
      display:block;
      width:100%;
      aspect-ratio:16/9;
      max-height: min(72vh, 720px);
      background:#9cdcf0;
      cursor: grab;
    }
    canvas.dragging { cursor: grabbing; }
    .toast {
      position:absolute;
      left:50%; top:18px;
      transform:translate(-50%,-14px);
      padding:9px 15px;
      border-radius:999px;
      color:#183125;
      background:rgba(255,253,244,.94);
      border:1px solid rgba(24,49,37,.15);
      box-shadow:0 8px 22px rgba(29,66,41,.18);
      font-weight:900;
      font-size:.86rem;
      opacity:0;
      transition:.22s ease;
      pointer-events:none;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .overlay {
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:20px;
      background:rgba(16,42,34,.54);
      backdrop-filter:blur(5px);
      opacity:0;
      pointer-events:none;
      transition:.2s ease;
    }
    .overlay.show { opacity:1; pointer-events:auto; }
    .result-card {
      width:min(420px, 92%);
      padding:26px;
      background:var(--panel);
      color:var(--ink);
      border:2px solid color-mix(in srgb, var(--green), transparent 35%);
      border-radius:24px 10px 24px 10px;
      text-align:center;
      box-shadow:0 22px 56px rgba(0,0,0,.28);
    }
    .result-card .kicker { margin:0; color:var(--green); font-weight:900; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; }
    .result-card h2 { margin:5px 0 4px; font-family:"Lilita One", ui-rounded, sans-serif; font-weight:400; font-size:2.45rem; }
    .stars { color:var(--sun); font-size:2.3rem; letter-spacing:.12em; text-shadow:0 2px 0 #b87808; line-height:1.2; }
    .result-card p { margin:8px 0 18px; color:var(--muted); font-weight:700; }
    .main-action {
      border:0;
      background:var(--sun);
      color:var(--button-ink);
      border-radius:13px;
      padding:12px 19px;
      font-weight:900;
      box-shadow:0 5px 0 #bf7d12;
      cursor:pointer;
    }
    .main-action:active { transform:translateY(3px); box-shadow:0 2px 0 #bf7d12; }
    .control-deck {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:16px;
      align-items:center;
      margin-top:15px;
      padding:13px 15px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px 12px 20px 20px;
      box-shadow:var(--shadow);
    }
    .howto { display:flex; align-items:center; gap:12px; min-width:0; }
    .mouse-glyph {
      width:37px; height:44px; flex:0 0 auto;
      border:3px solid var(--green);
      border-radius:17px;
      position:relative;
    }
    .mouse-glyph::before { content:""; position:absolute; left:50%; top:6px; width:3px; height:9px; border-radius:2px; background:var(--coral); transform:translateX(-50%); }
    .howto p { margin:0; font-weight:900; line-height:1.15; }
    .howto small { display:block; margin-top:4px; color:var(--muted); font-weight:700; line-height:1.25; }
    .controls { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    .mobile-shot-controls { display:none; }
    .club-group { display:flex; gap:6px; padding:4px; background:color-mix(in srgb, var(--green), transparent 89%); border-radius:13px; }
    .club-btn, .icon-btn {
      border:1px solid transparent;
      border-radius:10px;
      padding:8px 11px;
      color:var(--ink);
      background:transparent;
      font-weight:900;
      cursor:pointer;
    }
    .club-btn[aria-pressed="true"] { color:#fff; background:var(--green); box-shadow:0 3px 0 var(--green-2); }
    .icon-btn { width:40px; padding:8px; border-color:var(--line); background:color-mix(in srgb, var(--panel), var(--green) 5%); }
    .club-btn:focus-visible, .icon-btn:focus-visible, .main-action:focus-visible { outline:3px solid var(--coral); outline-offset:2px; }
    .hint-row { margin:12px 4px 0; display:flex; justify-content:space-between; gap:16px; color:var(--muted); font-size:.76rem; font-weight:800; }
    kbd { padding:2px 6px; background:var(--panel); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; color:var(--ink); font:700 .7rem "Nunito Sans", sans-serif; }
    @media (max-width: 720px) {
      .wrap { padding:12px 10px calc(20px + env(safe-area-inset-bottom)); }
      .game-head { align-items:center; margin-bottom:9px; }
      .eyebrow { font-size:.66rem; }
      h1 { font-size:1.6rem; }
      .score-chip { min-width:70px; padding:6px 8px; border-radius:10px; }
      .score-chip small { font-size:.58rem; }
      .score-chip strong { font-size:.9rem; }
      .stage-shell { border-width:2px; border-radius:15px 15px 8px 8px; box-shadow:0 5px 0 var(--green-2), var(--shadow); }
      canvas { max-height:none; aspect-ratio:16/10; }
      .control-deck { grid-template-columns:1fr; gap:10px; margin-top:10px; padding:11px; }
      .mouse-glyph { width:30px; height:36px; border-width:2px; }
      .howto p { font-size:.85rem; }
      .howto small { font-size:.7rem; }
      .mobile-shot-controls {
        display:grid;
        grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
        align-items:end;
        gap:10px;
        padding:10px;
        background:color-mix(in srgb, var(--green), transparent 91%);
        border-radius:14px;
      }
      .shot-setting { min-width:0; }
      .shot-setting label { display:flex; justify-content:space-between; gap:8px; margin:0 2px 5px; color:var(--muted); font-size:.7rem; font-weight:900; }
      .shot-setting output { color:var(--ink); }
      .shot-setting input { width:100%; min-height:32px; accent-color:var(--coral); touch-action:pan-x; }
      .swing-btn { min-width:74px; min-height:48px; padding:10px 13px; }
      .controls { justify-content:space-between; }
      .club-btn, .icon-btn { min-height:44px; }
      .club-btn { padding:8px 9px; font-size:.77rem; }
      .hint-row { font-size:.68rem; margin-top:10px; }
      .desktop-only { display:none; }
      .result-card { padding:20px; }
      .result-card h2 { font-size:2rem; }
      .stars { font-size:1.85rem; }
    }
    @media (max-width:390px) {
      .scoreboard { gap:5px; }
      .score-chip { min-width:61px; }
      .howto { gap:8px; }
      .controls { justify-content:flex-end; }
      .club-group { width:100%; }
      .club-btn { flex:1; padding:7px 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="game-head">
      <div>
        <p class="eyebrow" id="holeLabel">Hole 1 · Par 3</p>
        <h1 id="holeTitle">Clubhouse Caper</h1>
      </div>
      <div class="scoreboard" aria-label="Game status">
        <div class="score-chip"><small>Score</small><strong id="score">0</strong></div>
        <div class="score-chip"><small>Balls</small><strong id="balls">5</strong></div>
      </div>
    </div>

    <section class="stage-shell" aria-label="Golf demolition game">
      <canvas id="game" width="1280" height="720" aria-label="Drag the golf ball backward and release it to knock down every gopher"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="overlay" id="overlay" aria-hidden="true">
        <div class="result-card">
          <p class="kicker" id="resultKicker">Hole cleared</p>
          <h2 id="resultTitle">Birdie!</h2>
          <div class="stars" id="stars" aria-label="Three stars">★ ★ ★</div>
          <p id="resultCopy">The gophers are off the green.</p>
          <button class="main-action" id="nextBtn">Next hole →</button>
        </div>
      </div>
    </section>

    <section class="control-deck" aria-label="Game controls">
      <div class="howto">
        <span class="mouse-glyph" aria-hidden="true"></span>
        <div>
          <p>Pull the ball back, aim, and release.</p>
          <small>Clear every gopher before you run out of balls.</small>
        </div>
      </div>
      <div class="mobile-shot-controls" aria-label="Touch shot controls">
        <div class="shot-setting">
          <label for="arcControl"><span>Arc</span><output id="arcValue">36°</output></label>
          <input id="arcControl" type="range" min="12" max="75" value="36" aria-label="Shot arc in degrees">
        </div>
        <div class="shot-setting">
          <label for="powerControl"><span>Power</span><output id="powerValue">78%</output></label>
          <input id="powerControl" type="range" min="25" max="100" value="78" aria-label="Shot power percent">
        </div>
        <button class="main-action swing-btn" id="swingBtn">Swing</button>
      </div>
      <div class="controls">
        <div class="club-group" aria-label="Choose a club">
          <button class="club-btn" data-club="driver" aria-pressed="true">Driver</button>
          <button class="club-btn" data-club="iron" aria-pressed="false">Iron</button>
          <button class="club-btn" data-club="wedge" aria-pressed="false">Wedge</button>
          <button class="club-btn" data-club="chip" aria-pressed="false">Chip</button>
        </div>
        <button class="icon-btn" id="soundBtn" aria-label="Mute sound" title="Sound">♪</button>
        <button class="icon-btn" id="restartBtn" aria-label="Restart hole" title="Restart hole">↻</button>
      </div>
    </section>
    <div class="hint-row">
      <span>Tip: use Chip for a steep, lofted shot over obstacles.</span>
      <span class="desktop-only"><kbd>←</kbd><kbd>→</kbd> angle · <kbd>↑</kbd><kbd>↓</kbd> power · <kbd>Space</kbd> swing</span>
    </div>
  </main>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const ballsEl = document.getElementById('balls');
  const holeLabel = document.getElementById('holeLabel');
  const holeTitle = document.getElementById('holeTitle');
  const toast = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const resultKicker = document.getElementById('resultKicker');
  const resultTitle = document.getElementById('resultTitle');
  const resultCopy = document.getElementById('resultCopy');
  const starsEl = document.getElementById('stars');
  const nextBtn = document.getElementById('nextBtn');
  const soundBtn = document.getElementById('soundBtn');
  const restartBtn = document.getElementById('restartBtn');
  const arcControl = document.getElementById('arcControl');
  const powerControl = document.getElementById('powerControl');
  const arcValue = document.getElementById('arcValue');
  const powerValue = document.getElementById('powerValue');
  const swingBtn = document.getElementById('swingBtn');

  const W = 1280, H = 720, groundY = 625;
  const tee = {x:230, y:575};
  const G = 980;
  let levelIndex = 0, score = 0, ballsLeft = 5, club = 'driver';
  let ball, blocks = [], targets = [], particles = [], clouds = [];
  let aiming = false, aimPoint = {x:115,y:625}, aimAngle = -0.63, aimPower = .78;
  let gameState = 'ready', settleTime = 0, frameTime = performance.now(), muted = false, audioCtx = null, toastTimer;
  let swingPhase = 0;

  const levels = [
    {
      title:'Clubhouse Caper', par:3, balls:5, sky:'#9ddcf0', hills:['#86c95c','#52aa54'],
      blocks:[
        [835,545,42,80,'wood'],[955,545,42,80,'wood'],[815,505,202,34,'wood'],
        [875,425,36,80,'wood'],[945,425,36,80,'wood'],[850,390,155,32,'glass']
      ],
      targets:[[916,478],[915,360]]
    },
    {
      title:'Bunker Breakout', par:4, balls:5, sky:'#88d3ed', hills:['#8bcc5e','#459b51'],
      blocks:[
        [780,555,44,70,'stone'],[905,555,44,70,'wood'],[1030,555,44,70,'stone'],
        [750,515,354,35,'wood'],[830,435,38,80,'glass'],[985,435,38,80,'glass'],
        [800,400,255,32,'stone'],[900,320,42,80,'wood'],[865,286,112,30,'glass']
      ],
      targets:[[850,482],[1003,482],[920,368],[920,255]]
    },
    {
      title:'The 18th Menace', par:5, balls:6, sky:'#7fc9e7', hills:['#77bf57','#3c8e49'],
      blocks:[
        [720,548,48,77,'stone'],[835,548,42,77,'wood'],[950,548,42,77,'wood'],[1065,548,48,77,'stone'],
        [692,510,421,34,'stone'],[755,430,38,80,'glass'],[855,430,38,80,'wood'],[955,430,38,80,'wood'],[1055,430,38,80,'glass'],
        [720,394,375,34,'wood'],[790,314,42,80,'stone'],[975,314,42,80,'stone'],
        [760,279,290,32,'glass'],[875,200,56,79,'wood']
      ],
      targets:[[778,477],[878,477],[978,477],[1074,477],[900,360],[900,247],[903,168]]
    }
  ];

  const clubData = {
    driver:{power:6.7, lift:1.00, color:'#ef654d'},
    iron:{power:5.75, lift:1.08, color:'#167a4a'},
    wedge:{power:4.9, lift:1.34, color:'#e3a51f'},
    chip:{power:4.35, lift:1.62, color:'#d97a1b'}
  };

  function isDark(){ return matchMedia('(prefers-color-scheme: dark)').matches; }
  function initLevel(index, keepScore=true){
    levelIndex = index;
    if(!keepScore) score = 0;
    const l = levels[index];
    ballsLeft = l.balls;
    gameState = 'ready'; settleTime=0; swingPhase=0;
    ball = makeBall();
    blocks = l.blocks.map((b,i)=>({x:b[0],y:b[1],w:b[2],h:b[3],type:b[4],vx:0,vy:0,health:b[4]==='stone'?2.6:b[4]==='wood'?1.45:.75,broken:false,id:i,landed:false}));
    targets = l.targets.map((t,i)=>({x:t[0],y:t[1],r:24,vx:0,vy:0,alive:true,hit:0,id:i}));
    particles=[];
    clouds = Array.from({length:5},(_,i)=>({x:100+i*280+Math.random()*60,y:75+Math.random()*120,s:.72+Math.random()*.55}));
    holeLabel.textContent = `Hole ${index+1} · Par ${l.par}`;
    holeTitle.textContent = l.title;
    overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true');
    updateUI();
    syncTouchControls();
  }
  function makeBall(){ return {x:tee.x,y:tee.y,r:15,vx:0,vy:0,flying:false,rest:0,trail:[]}; }
  function updateUI(){ scoreEl.textContent=score.toLocaleString(); ballsEl.textContent=ballsLeft; }
  function resize(){
    const rect=canvas.getBoundingClientRect();
    const dpr=Math.min(devicePixelRatio||1,2);
    const pw=Math.round(rect.width*dpr), ph=Math.round(rect.height*dpr);
    if(canvas.width!==pw||canvas.height!==ph){ canvas.width=pw; canvas.height=ph; }
  }
  function pointerPos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
  }
  function clampAim(p){
    let dx=p.x-tee.x, dy=p.y-tee.y;
    const len=Math.hypot(dx,dy)||1, max=145;
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    dx=Math.min(dx,-18);
    return {x:tee.x+dx,y:tee.y+dy};
  }
  function syncTouchControls(){
    const degrees=Math.max(12,Math.min(75,Math.round(-aimAngle*180/Math.PI)));
    const power=Math.max(25,Math.min(100,Math.round(aimPower*100)));
    arcControl.value=degrees; powerControl.value=power;
    arcValue.textContent=`${degrees}°`; powerValue.textContent=`${power}%`;
  }
  function setAimFromTouch(){
    aimAngle=-Number(arcControl.value)*Math.PI/180;
    aimPower=Number(powerControl.value)/100;
    const r=145*aimPower;
    aimPoint={x:tee.x-Math.cos(aimAngle)*r,y:tee.y-Math.sin(aimAngle)*r};
    if(gameState==='ready'&&!aiming){ ball.x=aimPoint.x; ball.y=aimPoint.y; }
    syncTouchControls();
  }
  canvas.addEventListener('pointerdown',e=>{
    if(gameState!=='ready') return;
    const p=pointerPos(e);
    if(Math.hypot(p.x-ball.x,p.y-ball.y)<80 || p.x<420){
      aiming=true; canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
      aimPoint=clampAim(p); ball.x=aimPoint.x; ball.y=aimPoint.y;
      ensureAudio();
    }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!aiming) return;
    aimPoint=clampAim(pointerPos(e)); ball.x=aimPoint.x; ball.y=aimPoint.y;
    const dx=tee.x-aimPoint.x,dy=tee.y-aimPoint.y;
    aimPower=Math.min(1,Math.hypot(dx,dy)/145); aimAngle=Math.atan2(dy,dx);
    syncTouchControls();
  });
  canvas.addEventListener('pointerup',()=>{ if(aiming){ aiming=false; canvas.classList.remove('dragging'); launchFrom(aimPoint); }});
  canvas.addEventListener('pointercancel',()=>{aiming=false;canvas.classList.remove('dragging');ball=makeBall();});

  arcControl.addEventListener('input',setAimFromTouch);
  powerControl.addEventListener('input',setAimFromTouch);
  swingBtn.addEventListener('pointerdown',ensureAudio);
  swingBtn.addEventListener('click',()=>{
    if(gameState!=='ready'||overlay.classList.contains('show')) return;
    setAimFromTouch();
    launchFrom(aimPoint);
  });

  document.addEventListener('keydown',e=>{
    if(gameState!=='ready'||overlay.classList.contains('show')) return;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    if(e.code==='ArrowLeft') aimAngle=Math.max(-1.32,aimAngle-.045);
    if(e.code==='ArrowRight') aimAngle=Math.min(-.12,aimAngle+.045);
    if(e.code==='ArrowUp') aimPower=Math.min(1,aimPower+.05);
    if(e.code==='ArrowDown') aimPower=Math.max(.25,aimPower-.05);
    syncTouchControls();
    if(e.code==='Space'){
      const r=145*aimPower;
      launchFrom({x:tee.x-Math.cos(aimAngle)*r,y:tee.y-Math.sin(aimAngle)*r});
    } else {
      const r=145*aimPower;
      ball.x=tee.x-Math.cos(aimAngle)*r; ball.y=tee.y-Math.sin(aimAngle)*r;
    }
  });

  document.querySelectorAll('.club-btn').forEach(btn=>btn.addEventListener('click',()=>{
    club=btn.dataset.club;
    document.querySelectorAll('.club-btn').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
    announce(`${btn.textContent} selected`); playTone(420,.05,'triangle',.04);
  }));
  restartBtn.addEventListener('click',()=>initLevel(levelIndex,true));
  soundBtn.addEventListener('click',()=>{ muted=!muted; soundBtn.textContent=muted?'×':'♪'; soundBtn.setAttribute('aria-label',muted?'Turn sound on':'Mute sound'); if(!muted) playTone(500,.07,'sine',.05); });
  nextBtn.addEventListener('click',()=>{
    if(targets.every(t=>!t.alive)){
      if(levelIndex<levels.length-1) initLevel(levelIndex+1,true); else initLevel(0,false);
    } else initLevel(levelIndex,true);
  });

  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  function playTone(freq,dur,type='sine',vol=.05,slide=0){
    if(muted) return; ensureAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),audioCtx.currentTime+dur);
    g.gain.setValueAtTime(vol,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }
  function launchFrom(p){
    if(gameState!=='ready'||ballsLeft<=0) return;
    const dx=tee.x-p.x, dy=tee.y-p.y, len=Math.hypot(dx,dy);
    if(len<22){ announce('Pull back farther for a stronger swing'); ball=makeBall(); return; }
    const c=clubData[club];
    // Start the shot at the tee rather than at the pulled-back aim point.
    // This keeps a high, upward launch from intersecting the ground on release.
    ball.x=tee.x;ball.y=tee.y;ball.vx=dx*c.power;ball.vy=dy*c.power*c.lift;ball.flying=true;ball.rest=0;
    gameState='flying'; ballsLeft--; swingPhase=1; updateUI();
    playTone(club==='driver'?110:club==='iron'?145:185,.14,'triangle',.12,130);
    burst(tee.x,tee.y,10,'#f5f0dc',3);
  }
  function announce(msg){ clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1600); }

  function burst(x,y,n,color,speed=4){
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=Math.random()*speed+1; particles.push({x,y,vx:Math.cos(a)*v*55,vy:Math.sin(a)*v*55-45,life:.45+Math.random()*.5,max:.95,color,size:3+Math.random()*6}); }
  }

  function update(dt){
    swingPhase=Math.max(0,swingPhase-dt*2.2);
    clouds.forEach(c=>{c.x+=dt*7*c.s;if(c.x>1380)c.x=-160;});
    particles.forEach(p=>{p.vy+=G*.35*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});
    particles=particles.filter(p=>p.life>0);
    if(gameState!=='flying') return;

    // Ball physics.
    ball.vy+=G*dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    ball.vx*=Math.pow(.998,dt*60); ball.trail.push({x:ball.x,y:ball.y,a:1}); if(ball.trail.length>18)ball.trail.shift(); ball.trail.forEach(t=>t.a-=dt*1.8);
    if(ball.y+ball.r>groundY){ ball.y=groundY-ball.r; if(Math.abs(ball.vy)>65){ball.vy*=-.37;playTone(95,.035,'sine',.025);} else ball.vy=0; ball.vx*=Math.pow(.96,dt*60); }
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.45;}

    // Blocks fall and collide with ground / each other.
    for(const b of blocks){
      if(b.broken) continue;
      b.vy+=G*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.vx*=Math.pow(.985,dt*60);
      if(b.y+b.h>groundY){ b.y=groundY-b.h; if(Math.abs(b.vy)>130) b.health-=.25; b.vy=0;b.vx*=.8; }
    }
    for(let pass=0;pass<3;pass++){
      for(let i=0;i<blocks.length;i++) for(let j=i+1;j<blocks.length;j++) resolveBlocks(blocks[i],blocks[j]);
    }
    // Ball/block impacts.
    for(const b of blocks){ if(!b.broken) collideBallBlock(ball,b); }

    // Targets have gravity and ride platforms.
    for(const t of targets){
      if(!t.alive) continue;
      t.vy+=G*dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.vx*=Math.pow(.99,dt*60);
      let supported=false;
      for(const b of blocks){
        if(b.broken)continue;
        if(t.x>b.x-t.r*.5&&t.x<b.x+b.w+t.r*.5&&t.y+t.r>b.y&&t.y<t.y+t.r&&t.y<b.y+b.h){
          const prevBottom=t.y+t.r-t.vy*dt;
          if(prevBottom<=b.y+18&&t.vy>=0){t.y=b.y-t.r;t.vy=Math.min(0,b.vy);supported=true;}
        }
      }
      if(t.y+t.r>groundY){t.y=groundY-t.r;t.vy=0;supported=true;}
      const d=Math.hypot(ball.x-t.x,ball.y-t.y);
      if(d<ball.r+t.r){ knockTarget(t,Math.hypot(ball.vx,ball.vy)); ball.vx*=.68;ball.vy-=90; }
      if(!supported && t.y>H+80) knockTarget(t,220);
      for(const b of blocks){
        if(!b.broken && Math.abs(b.vx)+Math.abs(b.vy)>110 && circleRect(t.x,t.y,t.r,b)) knockTarget(t,Math.hypot(b.vx,b.vy));
      }
    }

    // Remove critically damaged blocks.
    for(const b of blocks){
      if(!b.broken && b.health<=0){ b.broken=true;score+=b.type==='stone'?450:b.type==='wood'?300:250;burst(b.x+b.w/2,b.y+b.h/2,14,b.type==='glass'?'#bfefff':b.type==='stone'?'#a9a89f':'#d49a52',4.5);playTone(b.type==='glass'?680:125,.1,b.type==='glass'?'sine':'square',.045,b.type==='glass'?-300:40);updateUI(); }
    }

    const speed=Math.hypot(ball.vx,ball.vy);
    if((speed<24&&ball.y>groundY-ball.r-3)||ball.x>W+140||ball.y>H+150){ball.rest+=dt;} else ball.rest=0;
    if(targets.every(t=>!t.alive)){settleTime+=dt;if(settleTime>.75)finish(true);}
    else if(ball.rest>.85){nextBall();}
  }

  function resolveBlocks(a,b){
    if(a.broken||b.broken)return;
    const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x), oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
    if(ox<=0||oy<=0)return;
    if(oy<ox){
      if(a.y<b.y){a.y-=oy*.5;b.y+=oy*.5;if(a.vy>b.vy){const m=(a.vy+b.vy)*.18;a.vy=m;b.vy=m;}}
      else {a.y+=oy*.5;b.y-=oy*.5;if(b.vy>a.vy){const m=(a.vy+b.vy)*.18;a.vy=m;b.vy=m;}}
    } else {
      const push=ox*.52;
      if(a.x<b.x){a.x-=push;b.x+=push;}else{a.x+=push;b.x-=push;}
      const av=a.vx;a.vx=b.vx*.35;b.vx=av*.35;
    }
  }
  function collideBallBlock(c,b){
    const nx=Math.max(b.x,Math.min(c.x,b.x+b.w)), ny=Math.max(b.y,Math.min(c.y,b.y+b.h));
    let dx=c.x-nx,dy=c.y-ny,d=Math.hypot(dx,dy);
    if(d>=c.r)return;
    if(d<.001){dx=c.x<(b.x+b.w/2)?-1:1;dy=0;d=1;}
    const nX=dx/d,nY=dy/d,pen=c.r-d,rel=c.vx*nX+c.vy*nY-(b.vx*nX+b.vy*nY);
    c.x+=nX*pen;c.y+=nY*pen;
    if(rel<0){
      const impulse=-rel*1.45;c.vx+=nX*impulse;c.vy+=nY*impulse;
      b.vx-=nX*impulse*.32;b.vy-=nY*impulse*.32;
      const impact=Math.abs(rel);
      if(impact>180){ b.health-=impact/(b.type==='stone'?520:b.type==='wood'?370:230); burst(nx,ny,Math.min(8,Math.ceil(impact/110)),b.type==='glass'?'#d8f7ff':b.type==='stone'?'#b3b2a9':'#dfae67',2.7); playTone(b.type==='glass'?620:150,.045,'triangle',.025,b.type==='glass'?-120:20); }
    }
  }
  function circleRect(x,y,r,b){const nx=Math.max(b.x,Math.min(x,b.x+b.w)),ny=Math.max(b.y,Math.min(y,b.y+b.h));return Math.hypot(x-nx,y-ny)<r;}
  function knockTarget(t,impact){
    if(!t.alive||impact<90)return;
    t.alive=false;t.hit=1;score+=2500;updateUI();burst(t.x,t.y,18,'#f6ce3f',5);playTone(360,.13,'square',.07,260);announce('Gopher cleared! +2,500');
  }
  function nextBall(){
    if(gameState!=='flying')return;
    if(ballsLeft<=0){finish(false);return;}
    ball=makeBall();gameState='ready';announce(`${ballsLeft} ball${ballsLeft===1?'':'s'} left`);
  }
  function finish(won){
    if(gameState==='ended')return;gameState='ended';
    const used=levels[levelIndex].balls-ballsLeft;
    if(won){ const bonus=ballsLeft*1200;score+=bonus;updateUI();resultKicker.textContent=`Hole ${levelIndex+1} cleared`;resultTitle.textContent=used<=levels[levelIndex].par?'Birdie!':'Nice recovery!';const stars=ballsLeft>=3?3:ballsLeft>=1?2:1;starsEl.textContent='★ '.repeat(stars).trim()+' ☆'.repeat(3-stars);starsEl.setAttribute('aria-label',`${stars} stars`);resultCopy.textContent=`All gophers cleared. Ball bonus: ${bonus.toLocaleString()} points.`;nextBtn.textContent=levelIndex<levels.length-1?'Next hole →':'Play again ↻';playTone(390,.18,'triangle',.08,310);setTimeout(()=>playTone(620,.22,'triangle',.07,210),160);}
    else {resultKicker.textContent='Out of balls';resultTitle.textContent='So close!';starsEl.textContent='○ ○ ○';starsEl.setAttribute('aria-label','No stars');resultCopy.textContent=`${targets.filter(t=>t.alive).length} gopher${targets.filter(t=>t.alive).length===1?'':'s'} still guarding the green.`;nextBtn.textContent='Try this hole again';}
    overlay.classList.add('show');overlay.setAttribute('aria-hidden','false');
  }

  function draw(){
    resize();
    const sx=canvas.width/W,sy=canvas.height/H;ctx.setTransform(sx,0,0,sy,0,0);ctx.clearRect(0,0,W,H);
    drawWorld();
    if(gameState==='ready') drawAim();
    drawGolfer();
    drawBlocks();drawTargets();drawBall();drawParticles();drawHUD();
  }
  function drawWorld(){
    const l=levels[levelIndex];
    const grad=ctx.createLinearGradient(0,0,0,groundY);grad.addColorStop(0,l.sky);grad.addColorStop(1,'#e8f7ed');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.72)';
    clouds.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,28*c.s,0,Math.PI*2);ctx.arc(c.x+35*c.s,c.y-12*c.s,40*c.s,0,Math.PI*2);ctx.arc(c.x+76*c.s,c.y,30*c.s,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='rgba(255,220,88,.92)';ctx.beginPath();ctx.arc(1120,95,52,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=l.hills[0];ctx.beginPath();ctx.moveTo(0,480);ctx.quadraticCurveTo(180,330,390,490);ctx.quadraticCurveTo(640,330,850,490);ctx.quadraticCurveTo(1100,330,1280,470);ctx.lineTo(1280,650);ctx.lineTo(0,650);ctx.fill();
    ctx.fillStyle=l.hills[1];ctx.beginPath();ctx.moveTo(0,535);ctx.quadraticCurveTo(240,410,520,560);ctx.quadraticCurveTo(760,445,1000,555);ctx.quadraticCurveTo(1160,500,1280,520);ctx.lineTo(1280,680);ctx.lineTo(0,680);ctx.fill();
    ctx.fillStyle='#2f9447';ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle='#24793d';ctx.fillRect(0,groundY,W,8);
    ctx.fillStyle='rgba(255,255,255,.13)';for(let x=-20;x<W;x+=82){ctx.beginPath();ctx.ellipse(x,670,52,9,-.1,0,Math.PI*2);ctx.fill();}
    // sand trap
    ctx.fillStyle='#e9ce7f';ctx.beginPath();ctx.ellipse(560,638,130,25,0,0,Math.PI*2);ctx.fill();
    // tee marker
    ctx.fillStyle='#fff';ctx.fillRect(tee.x+4,590,5,36);ctx.fillStyle='#ef654d';ctx.beginPath();ctx.moveTo(tee.x+9,590);ctx.lineTo(tee.x+42,600);ctx.lineTo(tee.x+9,609);ctx.closePath();ctx.fill();
  }
  function drawAim(){
    const dx=tee.x-ball.x,dy=tee.y-ball.y,c=clubData[club];
    if(Math.hypot(dx,dy)>14){
      ctx.save();ctx.setLineDash([9,8]);ctx.lineWidth=3;ctx.strokeStyle='rgba(20,65,42,.38)';ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(tee.x,tee.y);ctx.stroke();ctx.restore();
    }
    let px=tee.x,py=tee.y,vx=dx*c.power,vy=dy*c.power*c.lift;
    for(let i=0;i<11;i++){const t=i*.16;const x=px+vx*t,y=py+vy*t+.5*G*t*t;ctx.globalAlpha=Math.max(.15,.82-i*.055);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,5.5-i*.18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(22,75,49,.35)';ctx.lineWidth=1;ctx.stroke();}ctx.globalAlpha=1;
    const p=Math.min(1,Math.hypot(dx,dy)/145);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(40,44,170,16);ctx.fillStyle=p>.8?'#ef654d':'#ffd251';ctx.fillRect(40,44,170*p,16);ctx.strokeStyle='rgba(20,55,40,.45)';ctx.lineWidth=3;ctx.strokeRect(40,44,170,16);ctx.fillStyle='#17352b';ctx.font='900 15px "Nunito Sans"';ctx.fillText('SWING POWER',40,34);
  }
  function drawGolfer(){
    const x=150,y=groundY-22;ctx.save();
    const swing=swingPhase>0?Math.sin((1-swingPhase)*Math.PI)*1.45:aiming?-.9:-.25;
    // shadow
    ctx.fillStyle='rgba(20,60,35,.2)';ctx.beginPath();ctx.ellipse(x+12,groundY+3,54,12,0,0,Math.PI*2);ctx.fill();
    // legs
    ctx.strokeStyle='#23344a';ctx.lineWidth=17;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-56);ctx.lineTo(x-9,y-12);ctx.lineTo(x-26,y+2);ctx.moveTo(x+8,y-56);ctx.lineTo(x+21,y-12);ctx.lineTo(x+42,y+2);ctx.stroke();
    // shoes
    ctx.strokeStyle='#f4f1df';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(x-26,y+2);ctx.lineTo(x-39,y+2);ctx.moveTo(x+42,y+2);ctx.lineTo(x+56,y+2);ctx.stroke();
    // torso
    ctx.fillStyle='#f05e4c';ctx.beginPath();ctx.roundRect(x-26,y-130,60,77,18);ctx.fill();
    ctx.fillStyle='#fff4db';ctx.beginPath();ctx.arc(x+3,y-158,26,0,Math.PI*2);ctx.fill();
    // cap
    ctx.fillStyle='#173d34';ctx.beginPath();ctx.arc(x+1,y-166,27,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(x-3,y-168,38,8);
    // arm and club rotating from shoulder
    ctx.translate(x+22,y-112);ctx.rotate(swing);ctx.strokeStyle='#f4d3ae';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(35,35);ctx.stroke();ctx.strokeStyle='#58666c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(34,34);ctx.lineTo(86,95);ctx.stroke();ctx.fillStyle='#252d31';ctx.beginPath();ctx.roundRect(75,89,28,11,4);ctx.fill();
    ctx.restore();
  }
  function drawBlocks(){
    for(const b of blocks){if(b.broken)continue;ctx.save();ctx.translate(b.x,b.y);
      if(b.type==='wood'){
        ctx.fillStyle='#c9833d';ctx.fillRect(0,0,b.w,b.h);ctx.fillStyle='#e7a75d';ctx.fillRect(5,5,b.w-10,b.h-10);ctx.strokeStyle='rgba(101,55,24,.5)';ctx.lineWidth=3;ctx.strokeRect(0,0,b.w,b.h);ctx.beginPath();ctx.moveTo(7,b.h*.28);ctx.quadraticCurveTo(b.w*.55,b.h*.16,b.w-7,b.h*.3);ctx.moveTo(7,b.h*.72);ctx.quadraticCurveTo(b.w*.55,b.h*.6,b.w-7,b.h*.75);ctx.stroke();
      } else if(b.type==='stone'){
        ctx.fillStyle='#878f91';ctx.fillRect(0,0,b.w,b.h);ctx.fillStyle='#aab1b1';ctx.fillRect(5,5,b.w-10,b.h-10);ctx.strokeStyle='#606c6d';ctx.lineWidth=3;ctx.strokeRect(0,0,b.w,b.h);ctx.beginPath();ctx.moveTo(5,b.h/2);ctx.lineTo(b.w-5,b.h/2);ctx.moveTo(b.w/2,5);ctx.lineTo(b.w/2,b.h/2);ctx.moveTo(b.w*.32,b.h/2);ctx.lineTo(b.w*.32,b.h-5);ctx.stroke();
      } else {
        ctx.fillStyle='rgba(192,239,248,.65)';ctx.fillRect(0,0,b.w,b.h);ctx.strokeStyle='#dffaff';ctx.lineWidth=5;ctx.strokeRect(2.5,2.5,b.w-5,b.h-5);ctx.strokeStyle='rgba(75,155,174,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(5,b.h-5);ctx.lineTo(b.w-5,5);ctx.stroke();
      }
      if(b.health<(b.type==='stone'?1.8:b.type==='wood'?1:.5)){ctx.strokeStyle='rgba(70,45,35,.65)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.w*.5,0);ctx.lineTo(b.w*.35,b.h*.35);ctx.lineTo(b.w*.6,b.h*.6);ctx.lineTo(b.w*.42,b.h);ctx.stroke();}
      ctx.restore();}
  }
  function drawTargets(){
    for(const t of targets){if(!t.alive)continue;ctx.save();ctx.translate(t.x,t.y);
      ctx.fillStyle='#8b5c32';ctx.beginPath();ctx.arc(0,3,t.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#a9733d';ctx.beginPath();ctx.ellipse(0,9,t.r*.72,t.r*.62,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#8b5c32';ctx.beginPath();ctx.arc(-15,-14,9,0,Math.PI*2);ctx.arc(15,-14,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-3,7,0,Math.PI*2);ctx.arc(8,-3,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1c2d29';ctx.beginPath();ctx.arc(-6,-2,2.8,0,Math.PI*2);ctx.arc(6,-2,2.8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e7b06c';ctx.beginPath();ctx.ellipse(0,8,9,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#33261d';ctx.beginPath();ctx.arc(0,5,3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,11);ctx.lineTo(0,18);ctx.lineTo(4,11);ctx.stroke();
      ctx.restore();}
  }
  function drawBall(){
    if(!ball)return;
    ball.trail.forEach((t,i)=>{ctx.globalAlpha=Math.max(0,t.a)*.28;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,ball.r*(i/ball.trail.length)*.7,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
    ctx.save();ctx.translate(ball.x,ball.y);ctx.fillStyle='rgba(19,53,39,.22)';ctx.beginPath();ctx.ellipse(4,ball.r+5,ball.r*1.1,5,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(-5,-7,2,0,0,18);g.addColorStop(0,'#fff');g.addColorStop(1,'#d9ddd9');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a6aeaa';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(80,90,84,.22)';[[-6,-4],[5,-7],[8,4],[-4,7],[0,0]].forEach(d=>{ctx.beginPath();ctx.arc(d[0],d[1],1.7,0,Math.PI*2);ctx.fill();});ctx.restore();
  }
  function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;}
  function drawHUD(){
    const remaining=targets.filter(t=>t.alive).length;
    ctx.fillStyle='rgba(18,54,39,.78)';ctx.beginPath();ctx.roundRect(W-205,28,165,48,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 19px "Nunito Sans"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`${remaining} gopher${remaining===1?'':'s'} left`,W-122,52);ctx.textAlign='left';ctx.textBaseline='alphabetic';
    if(gameState==='ready'&&!aiming){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(315,518,240,52,15);ctx.fill();ctx.fillStyle='#17352b';ctx.font='900 18px "Nunito Sans"';ctx.fillText('DRAG BACK TO SWING',338,550);ctx.strokeStyle='#ef654d';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(321,575);ctx.lineTo(275,595);ctx.lineTo(294,568);ctx.moveTo(275,595);ctx.lineTo(309,601);ctx.stroke();}
  }
  function loop(now){const dt=Math.min(.025,(now-frameTime)/1000||0);frameTime=now;update(dt);draw();requestAnimationFrame(loop);}
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);
  initLevel(0,false);requestAnimationFrame(loop);
})();
</script>
</body>
